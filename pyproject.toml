[project]
name = "rag-mvp"
version = "0.1.0"
description = "Agentic RAG MVP: multi-tenant document Q&A with hybrid retrieval, RBAC and JWT auth"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.140",
    "uvicorn[standard]>=0.35",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "email-validator>=2.2",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2",
    "httpx>=0.28",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "anthropic>=1.11",
    "openai>=2.0",
    "ollama>=0.5",
    "qdrant-client>=1.15",
    "fastembed>=0.7",
    "langgraph>=1.0",
    "pymupdf4llm>=0.0.24",
    "python-docx>=1.1",
    "trafilatura>=2.0",
    "pillow>=11.0",
    "rapidocr>=3.9",
    "tiktoken>=0.9",
    "boto3>=1.38",
    "aiosmtplib>=4.0",
    "jinja2>=3.1",
    "streamlit>=1.45",
]

[project.optional-dependencies]
dev = ["python-dotenv>=1.0", "pytest>=8.3", "pytest-asyncio>=1.0", "ruff>=0.12", "mypy>=1.16"]

[project.scripts]
rag = "rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF001", "RUF002"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "E501"]
"evals/**" = ["ASYNC240", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
