name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag-ci-only
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rag" --health-interval 5s --health-retries 20
      qdrant:
        image: qdrant/qdrant:latest
        env:
          QDRANT__SERVICE__API_KEY: qdrant-ci-only
        ports: ["6333:6333"]
      objectstore:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: ci-access
          RUSTFS_SECRET_KEY: ci-secret-only
        ports: ["9000:9000"]
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://rag:rag-ci-only@localhost:5432/rag
      QDRANT_URL: http://localhost:6333
      QDRANT_API_KEY: qdrant-ci-only
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: ci-access
      S3_SECRET_KEY: ci-secret-only
      SMTP_PORT: "1025"
      EMBEDDING_DIM: "1024"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check src tests ui evals
      - run: uv run ruff format --check src tests ui evals
      - run: uv run mypy src
      - run: uv run pytest -q
      - name: Dependency vulnerability audit (OWASP A06)
        shell: bash
        run: uvx --python 3.12 pip-audit --strict --disable-pip --no-deps -r <(uv export --no-dev --no-hashes --frozen --no-emit-project)

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerability audit (OWASP A06)
        run: npm audit --omit=dev --audit-level=high

  # Retrieval/generation regression gate. Needs a seeded eval tenant + provider keys as secrets.
  eval:
    if: github.event_name == 'pull_request' && vars.EVAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python evals/run_eval.py --tenant-id "${{ vars.EVAL_TENANT_ID }}" --min-recall 0.85 --min-faithfulness 0.90
        env:
          DATABASE_URL: ${{ secrets.EVAL_DATABASE_URL }}
          QDRANT_URL: ${{ secrets.EVAL_QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.EVAL_QDRANT_API_KEY }}
          JWT_SECRET: ${{ secrets.EVAL_JWT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMBEDDING_PROVIDER: openai
          EMBEDDING_MODEL: text-embedding-3-small
          EMBEDDING_DIM: "1536"
