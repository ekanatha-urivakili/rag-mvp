name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag-ci-only
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rag" --health-interval 5s --health-retries 20
      qdrant:
        image: qdrant/qdrant:latest
        env:
          QDRANT__SERVICE__API_KEY: qdrant-ci-only
        ports: ["6333:6333"]
      objectstore:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: ci-access
          RUSTFS_SECRET_KEY: ci-secret-only
        ports: ["9000:9000"]
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://rag:rag-ci-only@localhost:5432/rag
      QDRANT_URL: http://localhost:6333
      QDRANT_API_KEY: qdrant-ci-only
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: ci-access
      S3_SECRET_KEY: ci-secret-only
      SMTP_PORT: "1025"
      EMBEDDING_DIM: "1024"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check src tests ui evals scripts loadtest
      - run: uv run ruff format --check src tests ui evals scripts loadtest
      - run: uv run mypy src
      - run: uv run pytest -q
      - name: Dependency vulnerability audit (OWASP A06)
        shell: bash
        run: uvx --python 3.12 pip-audit --strict --disable-pip --no-deps -r <(uv export --no-dev --no-hashes --frozen --no-emit-project)

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerability audit (OWASP A06)
        run: npm audit --omit=dev --audit-level=high

  # Browser end-to-end: real API + worker + production web build against service containers, emails via Mailpit.
  # No model is available in CI, so the opt-in chat spec (E2E_CHAT=1) is skipped here.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag-ci-only
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rag" --health-interval 5s --health-retries 20
      qdrant:
        image: qdrant/qdrant:latest
        env:
          QDRANT__SERVICE__API_KEY: qdrant-ci-only
        ports: ["6333:6333"]
      objectstore:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: ci-access
          RUSTFS_SECRET_KEY: ci-secret-only
        ports: ["9000:9000"]
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgresql+asyncpg://rag:rag-ci-only@localhost:5432/rag
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdefghijklmnop
      QDRANT_URL: http://localhost:6333
      QDRANT_API_KEY: qdrant-ci-only
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: ci-access
      S3_SECRET_KEY: ci-secret-only
      SMTP_PORT: "1025"
      EMBEDDING_DIM: "1024"
      PUBLIC_UI_URL: http://localhost:3000
      RL_SIGNUP_PER_IP: "100"
      API_URL: http://127.0.0.1:8000
      APP_ORIGIN: http://localhost:3000
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen
      - name: Start API and worker
        run: |
          uv run alembic upgrade head
          # Run from the venv, not `uv run`: a long-lived uv process holds the cache lock setup-uv prunes after the job.
          nohup .venv/bin/uvicorn rag.api.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          nohup .venv/bin/python -m rag.worker > worker.log 2>&1 &
          timeout 180 bash -c 'until curl -sf http://127.0.0.1:8000/healthz; do sleep 2; done'
      - name: Build and start web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          cp -r .next/static .next/standalone/.next/static
          PORT=3000 HOSTNAME=127.0.0.1 nohup node .next/standalone/server.js > ../web.log 2>&1 &
          timeout 120 bash -c 'until curl -sf -o /dev/null http://127.0.0.1:3000/login; do sleep 2; done'
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web/playwright-report
            web/test-results
            api.log
            worker.log
            web.log
          retention-days: 7

  # Retrieval/generation regression gate. Needs a seeded eval tenant + provider keys as secrets.
  eval:
    if: github.event_name == 'pull_request' && vars.EVAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python evals/run_eval.py --tenant-id "$EVAL_TENANT_ID" --min-recall 0.85 --min-faithfulness 0.90
        env:
          EVAL_TENANT_ID: ${{ vars.EVAL_TENANT_ID }}
          DATABASE_URL: ${{ secrets.EVAL_DATABASE_URL }}
          QDRANT_URL: ${{ secrets.EVAL_QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.EVAL_QDRANT_API_KEY }}
          JWT_SECRET: ${{ secrets.EVAL_JWT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMBEDDING_PROVIDER: openai
          EMBEDDING_MODEL: text-embedding-3-small
          EMBEDDING_DIM: "1536"
