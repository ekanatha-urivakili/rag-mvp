# Local alert delivery for the `observability` compose profile: every alert is emailed to Mailpit
# (http://localhost:8025). Prod: replace the receivers with your paging and chat integrations and keep the
# severity split (page = wake someone up, warn = next business day).
global:
  smtp_smarthost: mailpit:1025
  smtp_from: alertmanager@rag.local
  smtp_require_tls: false

route:
  receiver: warn
  group_by: [alertname, purpose, type]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="page"']
      receiver: page
      repeat_interval: 1h

# A page also silences warnings for the same route or job type while it fires.
inhibit_rules:
  - source_matchers: ['severity="page"']
    target_matchers: ['severity="warn"']
    equal: [purpose, type]

receivers:
  - name: page
    email_configs:
      - to: oncall-page@rag.local
        send_resolved: true
  - name: warn
    email_configs:
      - to: oncall-warn@rag.local
        send_resolved: true
