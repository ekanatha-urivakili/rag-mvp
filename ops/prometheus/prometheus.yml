# Local scrape config for the `observability` compose profile.
# Prod: set METRICS_TOKEN on the API and add `authorization: { credentials_file: /run/secrets/metrics_token }`.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: rag-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: rag-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8001"]
