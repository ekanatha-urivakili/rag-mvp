# Alerts from ARCHITECTURE §5.3. Thresholds mirror the §1 targets; tune once real traffic exists.
# DB-derived gauges (jobs_*, rag_online_*) are identical on every API replica, hence max().
groups:
  - name: rag
    rules:
      - alert: ApiDown
        expr: up{job="rag-api"} == 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: "API is not answering /metrics" }

      - alert: ApiErrorRateHigh
        expr: |
          sum(rate(http_requests_total{job="rag-api",route!~"/metrics|/healthz|/readyz",status=~"5.."}[10m]))
            / clamp_min(sum(rate(http_requests_total{job="rag-api",route!~"/metrics|/healthz|/readyz"}[10m])), 1e-9) > 0.02
        for: 10m
        labels: { severity: page }
        annotations: { summary: "More than 2% of API requests return 5xx" }

      - alert: ChatTimeToFirstTokenSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(rag_time_to_first_token_seconds_bucket[10m]))) > 3
        for: 15m
        labels: { severity: warn }
        annotations: { summary: "p95 time-to-first-token above the 3 s target" }

      - alert: ChatErrorsHigh
        expr: |
          sum(rate(rag_answers_total{outcome="error"}[10m])) / clamp_min(sum(rate(rag_answers_total[10m])), 1e-9) > 0.05
        for: 10m
        labels: { severity: page }
        annotations: { summary: "More than 5% of chat turns end in an error event" }

      # Rising fallback rate = Ollama or a provider is unhealthy (runbook: provider outage).
      - alert: LlmFallbackRateHigh
        expr: |
          sum by (purpose) (rate(llm_fallback_total[10m]))
            / clamp_min(sum by (purpose) (rate(llm_requests_total[10m])), 1e-9) > 0.05
        for: 10m
        labels: { severity: warn }
        annotations: { summary: "Route {{ $labels.purpose }} falls back on more than 5% of calls" }

      - alert: LlmRouteExhausted
        expr: time() - max by (purpose) (llm_route_exhausted_timestamp_seconds) < 600
        labels: { severity: page }
        annotations: { summary: "Every provider failed for route {{ $labels.purpose }}" }

      - alert: InsufficientContextRateHigh
        expr: |
          sum(rate(rag_answers_total{outcome="insufficient_context"}[1h]))
            / clamp_min(sum(rate(rag_answers_total{outcome=~"answered|insufficient_context"}[1h])), 1e-9) > 0.3
        for: 1h
        labels: { severity: warn }
        annotations: { summary: "Over 30% of retrieval questions get 'not in your documents'" }

      - alert: ThumbsDownRateHigh
        expr: |
          sum(increase(rag_feedback_total{rating="down"}[6h])) > 5
          and sum(increase(rag_feedback_total{rating="down"}[6h]))
            / clamp_min(sum(increase(rag_feedback_total[6h])), 1) > 0.3
        labels: { severity: warn }
        annotations: { summary: "Over 30% of feedback in the last 6 h is negative" }

      - alert: JobsFailing
        expr: max by (type) (jobs_failed_24h) > 0
        labels: { severity: warn }
        annotations: { summary: "{{ $value }} {{ $labels.type }} jobs failed terminally in 24 h" }

      - alert: JobBacklogStale
        expr: max by (type) (jobs_oldest_queued_age_seconds) > 600
        for: 5m
        labels: { severity: page }
        annotations: { summary: "Oldest runnable {{ $labels.type }} job waited over 10 min (worker down or saturated)" }

      - alert: OnlineFaithfulnessLow
        expr: max(rag_online_faithfulness_avg_24h) < 0.9 and max(rag_online_judged_24h) >= 20
        labels: { severity: warn }
        annotations: { summary: "Sampled faithfulness below the 0.90 target over 24 h" }
